<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#84B4C8">

  <title>Página no encontrada | Romina Ávila</title>

  <link rel="stylesheet" href="/styles.css">
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--muted);
      background:
        radial-gradient(circle at top right, var(--primary-light), transparent 38%),
        var(--tint);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 620px);
      padding: clamp(36px, 8vw, 70px);
      background: var(--white);
      border-radius: 28px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .error-code {
      margin: 0 0 10px;
      color: var(--accent-strong);
      font-size: clamp(4rem, 16vw, 7rem);
      font-weight: 800;
      line-height: 1;
    }

    h1 {
      margin: 0 0 18px;
      color: var(--heading);
      font-size: clamp(1.8rem, 6vw, 2.7rem);
      line-height: 1.15;
    }

    main p {
      margin: 0 auto 30px;
      max-width: 460px;
      line-height: 1.7;
    }

    a {
      min-height: 52px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 13px 24px;
      color: var(--heading);
      background: var(--primary);
      border-radius: 999px;
      font-weight: 700;
      text-decoration: none;
    }

    a:hover {
      background: var(--primary-light);
    }

    a:focus-visible {
      outline: 3px solid var(--accent-dark);
      outline-offset: 4px;
    }
  </style>
</head>

<body>
  <main>
    <p class="error-code" aria-hidden="true">404</p>

    <h1>Esta página no está disponible</h1>

    <p>
      Es posible que el enlace sea incorrecto o que la página haya cambiado de dirección.
      Podés regresar al sitio principal de Romina Ávila.
    </p>

    <a href="/">Volver al inicio</a>
  </main>
</body>
</html>
